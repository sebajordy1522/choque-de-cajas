<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control Animador</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #0f1115; color: white; margin: 0; padding: 15px; text-align: center; }
        
        /* PANTALLA DE INGRESO DE PIN */
        #login-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:#0f1115; z-index:2000; display:flex; flex-direction:column; justify-content:center; align-items:center; }
        
        .header-controls { display: flex; gap: 10px; margin-bottom: 25px; }
        .btn-top { flex: 1; background: #1c2128; color: #58a6ff; border: 1px solid #30363d; padding: 16px; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-reinicio { background: #238636; color: white; border-color: #2ea043; }

        .fila-movil { background: #1c2128; padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #30363d; }
        .btn-disparo { background: #da3633; color: white; width: 100%; padding: 26px; border: none; font-size: 24px; font-weight: 900; border-radius: 12px; cursor: pointer; box-shadow: inset 0 -5px 0 rgba(0,0,0,0.3); }
        .btn-disparo:active { transform: translateY(3px); }
        .btn-disparo:disabled { background: #333; color: #666; box-shadow: none; }
        
        #fase-alerta { font-size: 20px; margin-bottom: 15px; padding: 10px; background: #da3633; border-radius: 10px; font-weight: bold; display: none; }

        #modal-config { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f1115; display: none; flex-direction: column; z-index: 1000; overflow-y: auto; padding: 20px; box-sizing: border-box; text-align: left; }
        .config-card { background: #1c2128; border-radius: 15px; padding: 16px; margin-bottom: 15px; border: 1px solid #30363d; }
        .config-card h3 { margin-top: 0; color: #58a6ff; font-size: 16px; border-bottom: 1px solid #30363d; padding-bottom: 8px; margin-bottom: 12px;}
        
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 6px; color: #8b949e; font-size: 13px; }
        .input-group input, .input-group select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: white; font-size: 15px; box-sizing: border-box; }
        .input-group input[type="color"] { height: 45px; cursor: pointer; padding: 5px; }

        .modo-selector { display: flex; background: #0d1117; border-radius: 10px; border: 1px solid #30363d; overflow: hidden; margin-bottom: 12px;}
        .modo-btn { flex: 1; padding: 12px; text-align: center; font-weight: bold; cursor: pointer; color: #8b949e; }
        .modo-btn.activo { background: #58a6ff; color: #0d1117; }
        
        .bomb-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }
        .bomb-check { appearance: none; -webkit-appearance: none; width: 100%; height: 44px; background: #21262d; border-radius: 8px; cursor: pointer; border: 2px solid #30363d; margin:0;}
        .bomb-check:checked { background: #da3633; border-color: #ff7b72; }
        .bomb-check::after { content: "OK"; display: flex; justify-content: center; align-items: center; height: 100%; font-weight: bold; color: #8b949e; font-size: 14px; }
        .bomb-check:checked::after { content: "💣"; font-size: 20px; }

        .btn-guardar { background: #238636; color: #fff; padding: 16px; width: 100%; font-size: 18px; border: none; font-weight: bold; border-radius: 12px; margin-bottom: 10px; cursor: pointer; }
        .btn-cerrar { background: transparent; color: #8b949e; padding: 12px; width: 100%; font-size: 16px; border: none; font-weight: bold; margin-bottom: 25px; cursor: pointer; }
        
        .btn-borrar-logo { background: #da3633; color: white; padding: 8px; border: none; border-radius: 6px; font-weight: bold; margin-top: 10px; width: 100%; cursor: pointer;}
        #estado-foto { font-size: 12px; color: #2ea043; font-weight: bold; display: none; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- BLOQUEO INICIAL PARA PIN -->
    <div id="login-overlay">
        <h1 style="color:#da3633; font-size: 60px; margin-bottom: 10px; text-shadow: 0 2px 10px rgba(218,54,51,0.5);">💥</h1>
        <h2 style="color:#ffffff; margin-top: 0; font-size: 24px;">Conectar a Pantalla</h2>
        <p style="color:#8b949e; margin-bottom: 30px;">Ingresa el código PIN verde de tu Mac/TV</p>
        <input type="number" id="input-pin" placeholder="PIN" style="font-size:40px; text-align:center; width:220px; padding:15px; border-radius:12px; border:2px solid #30363d; background:#1c2128; color:white; margin-bottom:25px; letter-spacing: 5px; font-weight: bold;">
        <button onclick="conectarPin()" style="background:#238636; color:white; width: 220px; padding:20px; font-size:22px; font-weight:bold; border:none; border-radius:12px; cursor:pointer; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.3);">ENTRAR</button>
    </div>

    <div class="header-controls">
        <button class="btn-top" onclick="abrirConfig()">⚙️ Ajustes</button>
        <button class="btn-top btn-reinicio" onclick="reiniciarJuego()">🔄 Nuevo Juego</button>
    </div>

    <div id="fase-alerta">PARTIDA FINALIZADA</div>
    <h3 style="color: #8b949e; margin-bottom: 20px;">NIVEL ACTUAL: <span id="text-fase" style="color:white; font-size:32px; font-weight: 900;">1</span></h3>

    <div class="fila-movil">
        <button class="btn-disparo" id="btn-cliente" onclick="disparar('cliente')">🎯 DISPARAR ARRIBA</button>
    </div>

    <div class="fila-movil">
        <button class="btn-disparo" id="btn-casa" onclick="disparar('casa')">🎯 DISPARAR ABAJO</button>
    </div>

    <div id="modal-config">
        <h2 style="text-align: center; font-size: 22px; margin-top: 0; color: #fff;">Ajustes del Juego</h2>
        
        <div class="config-card">
            <h3>🎨 Diseño (Colores y Logo)</h3>
            <div class="input-group">
                <label>Tomar Foto o Subir Logo</label>
                <input type="file" id="input-logo" accept="image/*">
                <div id="estado-foto">✓ Imagen procesada y lista</div>
                <button class="btn-borrar-logo" onclick="borrarLogo()">Quitar Logo Guardado</button>
            </div>
            <div class="input-group">
                <label>Color de Fondo</label>
                <input type="color" id="input-bg" value="#0a0a0c">
            </div>
            <div class="input-group">
                <label>Color de Cajas</label>
                <input type="color" id="input-cajas" value="#8B4513">
            </div>
            <div class="input-group">
                <label>Color del Texto</label>
                <input type="color" id="input-texto" value="#ffffff">
            </div>
            <div class="input-group">
                <label>Tipo de Letra</label>
                <select id="input-fuente">
                    <option value="'Arial', sans-serif">Moderna (Arial)</option>
                    <option value="'Courier New', monospace">Arcade (Courier)</option>
                    <option value="'Impact', sans-serif">Gruesa (Impact)</option>
                    <option value="'Times New Roman', serif">Clásica (Times)</option>
                </select>
            </div>
            <div class="input-group">
                <label>Tamaño Título Principal (px)</label>
                <input type="number" id="input-tamano" value="45">
            </div>
        </div>

        <div class="config-card">
            <h3>🏆 Premios (1 al 5)</h3>
            <div class="input-group">
                <input type="text" id="premio1" value="Shot Tequila" style="margin-bottom:6px;">
                <input type="text" id="premio2" value="Piscola" style="margin-bottom:6px;">
                <input type="text" id="premio3" value="Tabla Mixta" style="margin-bottom:6px;">
                <input type="text" id="premio4" value="2x1 Tragos" style="margin-bottom:6px;">
                <input type="text" id="premio5" value="GRAN PREMIO VIP">
            </div>
        </div>

        <div class="config-card">
            <h3>💣 Modo de Explosión</h3>
            <div class="modo-selector">
                <div class="modo-btn activo" id="btn-aleatorio" onclick="setModo(false)">🎲 Aleatorio</div>
                <div class="modo-btn" id="btn-manual" onclick="setModo(true)">🛠️ Manual</div>
            </div>
            
            <div id="contenedor-mapa" style="display: none;">
                <p style="color: #8b949e; font-size: 12px; margin-bottom: 8px;">Toca las casillas donde quieras bomba</p>
                <label style="color: #fff; font-weight: bold; font-size: 13px; display:block; margin-bottom:4px;">Fila Arriba</label>
                <div class="bomb-grid">
                    <input type="checkbox" class="bomb-check" id="b-cliente-1"><input type="checkbox" class="bomb-check" id="b-cliente-2"><input type="checkbox" class="bomb-check" id="b-cliente-3"><input type="checkbox" class="bomb-check" id="b-cliente-4"><input type="checkbox" class="bomb-check" id="b-cliente-5">
                </div>
                <label style="color: #fff; font-weight: bold; font-size: 13px; display:block; margin-bottom:4px;">Fila Abajo</label>
                <div class="bomb-grid">
                    <input type="checkbox" class="bomb-check" id="b-casa-1"><input type="checkbox" class="bomb-check" id="b-casa-2"><input type="checkbox" class="bomb-check" id="b-casa-3"><input type="checkbox" class="bomb-check" id="b-casa-4"><input type="checkbox" class="bomb-check" id="b-casa-5">
                </div>
            </div>
        </div>

        <button class="btn-guardar" onclick="guardarYEnviar(true)">💾 Guardar y Aplicar</button>
        <button class="btn-cerrar" onclick="cerrarConfig()">Cerrar Menú</button>
    </div>

    <script>
        const socket = io();
        let logoBase64 = null;
        let esModoManual = false;

        // Recuperar memoria en silencio
        window.onload = () => {
            try {
                const saved = localStorage.getItem('choqueMemoria');
                if(saved) {
                    const cfg = JSON.parse(saved);
                    if(cfg.premios) {
                        document.getElementById('premio1').value = cfg.premios[0] || "Shot Tequila";
                        document.getElementById('premio2').value = cfg.premios[1] || "Piscola";
                        document.getElementById('premio3').value = cfg.premios[2] || "Tabla Mixta";
                        document.getElementById('premio4').value = cfg.premios[3] || "2x1 Tragos";
                        document.getElementById('premio5').value = cfg.premios[4] || "GRAN PREMIO VIP";
                    }
                    if(cfg.colorFondo) document.getElementById('input-bg').value = cfg.colorFondo;
                    if(cfg.colorCajas) document.getElementById('input-cajas').value = cfg.colorCajas;
                    if(cfg.colorTexto) document.getElementById('input-texto').value = cfg.colorTexto;
                    if(cfg.fuente) document.getElementById('input-fuente').value = cfg.fuente;
                    if(cfg.tamanoTexto) document.getElementById('input-tamano').value = cfg.tamanoTexto;
                    if(cfg.logoBase64 && cfg.logoBase64 !== "") logoBase64 = cfg.logoBase64;
                }
            } catch(e) { localStorage.removeItem('choqueMemoria'); }
        };

        // FUNCIÓN DE INGRESO PIN
        function conectarPin() {
            const pin = document.getElementById('input-pin').value;
            if(pin.length >= 4) {
                socket.emit('joinRoom', pin);
                document.getElementById('login-overlay').style.display = 'none';
                
                // Enviar configuraciones guardadas al instante a la pantalla conectada
                guardarYEnviar(false);
            } else {
                alert("Ingresa los 4 números que aparecen en la esquina verde de la pantalla.");
            }
        }

        document.getElementById('input-logo').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 400; const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH; canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        logoBase64 = canvas.toDataURL('image/jpeg', 0.7);
                        document.getElementById('estado-foto').style.display = 'block';
                        setTimeout(() => document.getElementById('estado-foto').style.display = 'none', 3000);
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function borrarLogo() {
            logoBase64 = ""; document.getElementById('input-logo').value = "";
            guardarYEnviar(false); alert("Logo borrado de la pantalla.");
        }

        socket.on('updateTablero', (data) => {
            document.getElementById('text-fase').innerText = data.faseActual;
            const bloqueado = data.juegoTerminado;
            document.getElementById('btn-cliente').disabled = bloqueado;
            document.getElementById('btn-casa').disabled = bloqueado;
            document.getElementById('fase-alerta').style.display = bloqueado ? 'block' : 'none';
        });

        function disparar(seleccion) { 
            document.getElementById('btn-cliente').disabled = true; document.getElementById('btn-casa').disabled = true; 
            socket.emit('abrirCaja', { seleccion: seleccion }); 
        }
        
        function reiniciarJuego() { 
            if(confirm('¿Iniciar nueva partida? Volverá a modo aleatorio.')) { 
                setModo(false); guardarYEnviar(false); socket.emit('reiniciar'); 
            } 
        }
        
        function abrirConfig() { document.getElementById('modal-config').style.display = 'flex'; }
        function cerrarConfig() { document.getElementById('modal-config').style.display = 'none'; }
        
        function setModo(isManual) {
            esModoManual = isManual;
            if(isManual) {
                document.getElementById('btn-manual').classList.add('activo');
                document.getElementById('btn-aleatorio').classList.remove('activo');
                document.getElementById('contenedor-mapa').style.display = 'block';
            } else {
                document.getElementById('btn-aleatorio').classList.add('activo');
                document.getElementById('btn-manual').classList.remove('activo');
                document.getElementById('contenedor-mapa').style.display = 'none';
            }
        }

        function guardarYEnviar(mostrarAlerta = true) {
            let mapaBombas = {};
            if(esModoManual) {
                for(let i=1; i<=5; i++) {
                    mapaBombas[`cliente-${i}`] = document.getElementById(`b-cliente-${i}`).checked;
                    mapaBombas[`casa-${i}`] = document.getElementById(`b-casa-${i}`).checked;
                }
            }
            
            const config = {
                logoBase64: logoBase64,
                premios: [
                    document.getElementById('premio1').value, document.getElementById('premio2').value, 
                    document.getElementById('premio3').value, document.getElementById('premio4').value, document.getElementById('premio5').value
                ],
                modoManual: esModoManual, mapaBombas: mapaBombas,
                colorFondo: document.getElementById('input-bg').value, colorCajas: document.getElementById('input-cajas').value,
                colorTexto: document.getElementById('input-texto').value, fuente: document.getElementById('input-fuente').value,
                tamanoTexto: document.getElementById('input-tamano').value
            };
            
            try { localStorage.setItem('choqueMemoria', JSON.stringify(config)); } catch (e) {}
            
            socket.emit('configurarJuego', config); 
            if(mostrarAlerta) cerrarConfig();
        }
    </script>
</body>
</html>
